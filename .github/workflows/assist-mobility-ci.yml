name: Assist Mobility CI

# Compile-checks (flutter analyze) the Assist Provider Mobility code and runs the
# unit tests, on GitHub's runners where the Flutter toolchain is available.
# Analyze is scoped to the mobility files and uses the repo's own fatal-level policy
# (errors fail the build; pre-existing style warnings/infos do not), matching build.yml.

on:
  push:
    branches: [ "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Assist mobility files
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/constants/api.dart \
            lib/requests/provider_mobility.request.dart \
            lib/view_models/provider_mobility.vm.dart \
            lib/views/pages/profile/provider_mobility.page.dart \
            lib/view_models/profile.vm.dart \
            lib/views/pages/profile/profile.page.dart

      - name: Unit tests
        run: flutter test
