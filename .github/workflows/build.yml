name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
      - name: Write key.properties
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (compile check of the Assist accept/reject files)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/requests/assist_job.request.dart \
            lib/services/assist_job.service.dart \
            lib/view_models/order_details.vm.dart \
            lib/views/pages/order/orders_details.page.dart \
            lib/views/pages/order/widgets/order_actions.dart \
            lib/widgets/bottomsheets/new_order_alert.bottomsheet.dart \
            lib/models/order.dart 2>&1 | tee analyze.txt
          echo '### flutter analyze' >> "$GITHUB_STEP_SUMMARY"
          tail -40 analyze.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - name: Show signing fingerprint of the AAB
        run: |
          echo "### Signing certificate of app-release.aab" >> $GITHUB_STEP_SUMMARY
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "SHA1|SHA256|Owner" | tee -a $GITHUB_STEP_SUMMARY
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
